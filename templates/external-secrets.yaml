{{- $chart_name := .Chart.Name }}
{{- $chart_version := .Chart.Version | replace "+" "_" }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}

{{- if .Values.clusterExternalSecret.enabled }}
{{- range $i, $secret := .Values.clusterExternalSecret.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ $secret.name }}
  labels:
    chart: "{{ $chart_name }}-{{ $chart_version }}"
  {{- if $secret.annotations }}
  annotations:
    {{- toYaml $secret.annotations | nindent 4 }}
  {{- end}}
spec:
  externalSecretName: {{ $secret.externalSecretName }}
  namespaceSelectors:
    {{- toYaml $secret.namespaceSelectors | nindent 4 }}
  {{- if $secret.refreshTime }}
  refreshTime: {{ $secret.refreshTime }}
  {{- end }}
  {{- if $secret.refreshInterval }}
  refreshInterval: {{ $secret.refreshInterval }}
  {{- end }}
  externalSecretSpec:
    secretStoreRef:
      name: {{ $secret.externalSecretSpec.secretStoreRef.name }}
      kind: {{ $secret.externalSecretSpec.secretStoreRef.kind }}
    target:
      creationPolicy: {{ (default dict $secret.externalSecretSpec.target).creationPolicy | default "Owner" | quote }}
      {{- with $secret.externalSecretSpec.target }}
      {{- toYaml (omit . "creationPolicy") | nindent 6 }}
      {{- end }}
    {{- if $secret.externalSecretSpec.data }}
    data:
    {{- include "external-secrets-store-secret-plus.data" $secret.externalSecretSpec.data | nindent 6 }}
    {{- end }}
    {{- if $secret.externalSecretSpec.dataFrom }}
    dataFrom:
    {{- include "external-secrets-store-secret-plus.dataFrom" $secret.externalSecretSpec.dataFrom | nindent 6 }}
    {{- end}}
{{- end }}
{{- end}}
---
{{- if .Values.externalSecret.enabled }}
{{- range $i, $secret := .Values.externalSecret.secrets}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $namespace }}
  labels:
    chart: "{{ $chart_name }}-{{ $chart_version }}"
  {{- if $secret.annotations }}
  annotations:
    {{- toYaml $secret.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $secret.refreshInterval }}
  refreshInterval: {{ $secret.refreshInterval }}
  {{- end }}
  secretStoreRef:
    name: {{ $secret.secretStoreRef.name }}
    kind: {{ $secret.secretStoreRef.kind }}
  target:
    creationPolicy: {{ (default dict $secret.target).creationPolicy | default "Owner" | quote }}
    {{- with $secret.target }}
    {{- toYaml (omit . "creationPolicy") | nindent 4 }}
    {{- end }}
  {{- if $secret.data }}
  data:
  {{- include "external-secrets-store-secret-plus.data" $secret.data | nindent 4 }}
  {{- end }}
  {{- if $secret.dataFrom }}
  dataFrom:
  {{- include "external-secrets-store-secret-plus.dataFrom" $secret.dataFrom | nindent 4 }}
  {{- end}}
{{- end }}
{{- end }}